<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>3D Cube Fingertip Test</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      transform: scaleX(-1);
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
    }
    #ui-overlay {
      position: absolute;
      top: 16px;
      left: 16px;
      color: #fff;
      background: rgba(0, 0, 0, 0.75);
      padding: 12px 16px;
      border-radius: 8px;
      z-index: 10;
    }
    button {
      background: #007aff;
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <video id="webcam" autoplay playsinline muted></video>
  <div id="canvas-container"></div>

  <div id="ui-overlay">
    <button id="start-btn">Start Camera & Tracking</button>
    <p id="status">Status: Tap button to start</p>
  </div>

  <script type="module">
    import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/vision_bundle.mjs";

    const video = document.getElementById('webcam');
    const startBtn = document.getElementById('start-btn');
    const statusText = document.getElementById('status');
    const container = document.getElementById('canvas-container');

    let handLandmarker = null;
    let lastVideoTime = -1;
    let isTracked = false;

    const currentPos = new THREE.Vector3(0, 0, 0);
    const targetPos = new THREE.Vector3(0, 0, 0);
    const LERP_FACTOR = 0.25;

    let cubeScale = 0;
    const TARGET_SCALE = 0.15;
    const SCALE_SPEED = 0.08;

    // Three.js Setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 2;

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const geometry = new THREE.BoxGeometry(1, 1, 1);
    const material = new THREE.MeshNormalMaterial();
    const cube = new THREE.Mesh(geometry, material);
    cube.scale.set(0, 0, 0);
    scene.add(cube);

    async function startApp() {
      statusText.innerText = "Status: Requesting camera...";
      
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        video.srcObject = stream;
        await video.play();

        statusText.innerText = "Status: Loading MediaPipe...";

        const visionFiles = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm"
        );

        handLandmarker = await HandLandmarker.createFromOptions(visionFiles, {
          baseOptions: {
            modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
            delegate: "GPU"
          },
          runningMode: "VIDEO",
          numHands: 1,
          minHandDetectionConfidence: 0.5,
          minTrackingConfidence: 0.5
        });

        statusText.innerText = "Status: Tracking Active";
        startBtn.style.display = 'none';
        render();

      } catch (err) {
        statusText.innerText = "Error: " + err.message;
        console.error(err);
      }
    }

    startBtn.addEventListener('click', startApp);

    function render() {
      requestAnimationFrame(render);

      if (video.currentTime !== lastVideoTime && handLandmarker) {
        lastVideoTime = video.currentTime;
        const results = handLandmarker.detectForVideo(video, performance.now());

        if (results.landmarks && results.landmarks.length > 0) {
          isTracked = true;
          const indexTip = results.landmarks[0][8];

          const normalizedX = -(indexTip.x * 2 - 1);
          const normalizedY = -(indexTip.y * 2 - 1);

          const vector = new THREE.Vector3(normalizedX, normalizedY, 0.5);
          vector.unproject(camera);
          const dir = vector.sub(camera.position).normalize();
          targetPos.copy(camera.position).add(dir.multiplyScalar(1.8));
        } else {
          isTracked = false;
        }
      }

      if (isTracked) {
        currentPos.lerp(targetPos, LERP_FACTOR);
        cube.position.copy(currentPos);
        if (cubeScale < TARGET_SCALE) cubeScale = Math.min(TARGET_SCALE, cubeScale + SCALE_SPEED);
      } else {
        if (cubeScale > 0) cubeScale = Math.max(0, cubeScale - SCALE_SPEED);
      }

      cube.scale.set(cubeScale, cubeScale, cubeScale);
      cube.rotation.x += 0.02;
      cube.rotation.y += 0.02;

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
